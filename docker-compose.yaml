# docker-compose.minio.yml

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # Console UI
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_VOLUMES="/data"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
      - ./minio-logs:/var/log/minio  # optional
    networks:
      - minio-net

volumes:
  minio-data:
    name: minio_data_volume

networks:
  minio-net:
    driver: bridge
    name: minio_dev_net  # optional, but helps visibility

